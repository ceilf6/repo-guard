name: Repo Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  guard:
    # This job runs on a local self-hosted runner with intranet model access.
    # Keep untrusted forks and outsider-triggered issues/comments away from it.
    if: >
      github.actor != 'dependabot[bot]' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issues' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        ) ||
        (
          github.event_name == 'issue_comment' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    # REPO_GUARD_RUNNER selects a self-hosted runner label (e.g. repo-guard-claude)
    # so the claude-code engine can run next to an authenticated Claude Code CLI.
    runs-on: ${{ vars.REPO_GUARD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      # The action itself always runs from the default branch so PR code cannot
      # rewrite the runtime; the PR head is checked out separately as review data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          path: pr-head
      - uses: ./
        with:
          type: both
          engine: ${{ vars.REPO_GUARD_ENGINE || 'api' }}
          workspace: ${{ (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)) && format('{0}/pr-head', github.workspace) || github.workspace }}
          claude-model: ${{ vars.CLAUDE_CODE_MODEL }}
          provider: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          model: ${{ vars.LLM_MODEL || 'claude-opus-4-7-thinking' }}
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          structured-output: ${{ vars.LLM_STRUCTURED_OUTPUT || 'auto' }}
          provider-order: ${{ vars.LLM_PROVIDER_ORDER }}
